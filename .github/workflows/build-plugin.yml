name: Validate and package QGIS plugin

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate source archive
        run: python scripts/build_plugin.py
      - name: Check packaging regressions
        run: python -m unittest discover -s tests -p 'test_packaging.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: contours2mesh
          path: dist/*.zip

  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: contours2mesh
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
